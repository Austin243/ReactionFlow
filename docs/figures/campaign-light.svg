<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 452" width="1200" height="452" role="img" aria-labelledby="rf-campaign-title rf-campaign-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="rf-campaign-title">Campaigns</title><desc id="rf-campaign-desc">Eight trajectories run as eight independent tasks on two four-GPU nodes. Each lane shows molecular dynamics with occasional pauses for pathway refinement in that lane only. One trajectory stops with an error while the others continue. After the job ends, resubmitting the same command resumes the incomplete trajectories from their exact checkpoints and leaves the completed one unchanged.</desc>

