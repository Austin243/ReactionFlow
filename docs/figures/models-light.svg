<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 414" width="1200" height="414" role="img" aria-labelledby="rf-models-title rf-models-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="rf-models-title">Models</title><desc id="rf-models-desc">Ten built-in adapters: MACE, MACE-FIELD, UMA, AIMNet2, ORB, MatterSim, CHGNet, SevenNet, NEP89, and ANI-1xnr, plus a generic adapter for any ASE calculator and a custom adapter interface. Every adapter provides three methods: start, restore, and calculator. Three commands list the models, prepare the selected one, and run.</desc>

