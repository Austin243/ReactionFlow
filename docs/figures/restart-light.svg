<title id="rf-restart-title">Exact restart</title><desc id="rf-restart-desc">A checkpoint holds the atoms, the integrator, thermostat and barostat state, the random-number generator, the calculator contract, and the bond monitor. Two charts compare a run that was stopped at step 150 and restored with a run that never stopped: after an exact restart the cell volume follows the same curve and the position difference is zero at every step, while a restart from atoms, momenta, and cell alone drifts away.</desc>

