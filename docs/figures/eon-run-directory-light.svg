<text x="88" y="341.1" font-size="20" font-weight="500" fill="#1f2328"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18.8">steps/step-000000.json</tspan></text>
