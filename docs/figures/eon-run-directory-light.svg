<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 422" width="1200" height="422" role="img" aria-labelledby="rf-eon-run-directory-title rf-eon-run-directory-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="rf-eon-run-directory-title">What an EON run writes</title><desc id="rf-eon-run-directory-desc">Directory tree of one EON campaign with search-contract.json, search-state.json, and eon.log, then one record per state, per search attempt, per process with its reverse, and per kinetic Monte Carlo step.</desc>

<rect x="0.5" y="0.5" width="1199" height="421" rx="14" fill="#ffffff" stroke="#d1d9e0"/>
<rect x="36" y="16" width="1128" height="342" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="58" y="53.1" font-size="20" font-weight="700" fill="#1f2328"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18.8">outputs/&lt;campaign&gt;/</tspan></text>
<path d="M66 62 V78 H82" fill="none" stroke="#c0c8d1" stroke-width="1.25"/>
<line x1="66" y1="78" x2="66" y2="94" fill="none" stroke="#c0c8d1" stroke-width="1.25"/>
