<circle cx="486" cy="110" r="5.5" fill="#818b98"/>
<text x="504" y="117.1" font-size="20" fill="#59636e">current state and clock</text>
<path d="M66 126 V142 H82" fill="none" stroke="#c0c8d1" stroke-width="1.25"/>
