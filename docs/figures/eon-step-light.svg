<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="rf-eon-step-title rf-eon-step-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="rf-eon-step-title">A kinetic Monte Carlo step</title><desc id="rf-eon-step-desc">The first kinetic Monte Carlo step of the model run. On the left is the rate of each process out of the starting state, prefactor times exp(-barrier/kT) at 300 K. In the middle a random number picks one process in proportion to its rate. On the right the clock advances by a random time drawn from the exponential distribution with mean 1 over the summed rate.</desc>

