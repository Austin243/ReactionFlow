<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="rf-ensembles-title rf-ensembles-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="rf-ensembles-title">Constant volume and constant pressure</title><desc id="rf-ensembles-desc">Comparison of pathway refinement at constant volume and at constant pressure. At constant volume the cell is fixed, the band is a nudged elastic band, and the barrier is a potential-energy difference. At constant pressure the cell relaxes along the band with solid-state NEB and the barrier is an enthalpy difference. A chart of a model system shows the enthalpy barrier rising from 0.063 to 0.095 eV between 0 and 0.8 GPa while the cell volume grows along the band.</desc>

