<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="rf-how-it-works-title rf-how-it-works-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="rf-how-it-works-title">How ReactionFlow works</title><desc id="rf-how-it-works-desc">Timeline of one trajectory. Molecular dynamics runs while a bond monitor checks every observation interval. When a bond change persists, the dynamics pause at an exact checkpoint, the pathway is refined by endpoint relaxation, nudged elastic band, climbing image, and saddle checks, and then the checkpoint is restored and the same trajectory continues. Five cards summarize the steps: run MD, watch bonds, checkpoint, refine, resume.</desc>
