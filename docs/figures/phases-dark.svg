<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="rf-phases-title rf-phases-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="rf-phases-title">Run phases</title><desc id="rf-phases-desc">A trajectory starts as new, then alternates between running and refining: when a pathway is queued the run checkpoints and refines, and when every queued pathway has an outcome it restores the checkpoint and runs again. It ends as completed when it reaches its step target, or as failed if its run state cannot be saved.</desc>

<rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="#0d1117" stroke="#3d444d"/>
