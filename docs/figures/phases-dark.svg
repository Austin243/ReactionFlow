<rect x="785" y="34" width="170" height="56" rx="10" fill="#0f2523" stroke="#199e70" stroke-width="1.75"/>
<text x="870" y="69.81" font-size="22" font-weight="700" text-anchor="middle" fill="#f0f6fc"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="20.68">refining</tspan></text>
<rect x="355" y="168" width="190" height="56" rx="10" fill="#0d2515" stroke="#0ca30c" stroke-width="1.75"/>
