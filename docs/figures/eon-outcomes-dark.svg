<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 382" width="1200" height="382" role="img" aria-labelledby="rf-eon-outcomes-title rf-eon-outcomes-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="rf-eon-outcomes-title">Search outcomes</title><desc id="rf-eon-outcomes-desc">Each EON search passes four checks, the search itself, the thermal window, whether the saddle is already known, and whether the product is the starting state. They end the search as failed, outside_window, repeat, or same_state. A search that passes all four is a new process and resets the count of repeats, and a repeat adds one. A chart shows the confidence 1 - 1/N reaching 0.95 after 20 repeats in a row, when the kinetic Monte Carlo step is taken.</desc>

