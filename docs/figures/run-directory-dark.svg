<path d="M96 382 V398 H112" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<text x="118" y="405.1" font-size="20" font-weight="500" fill="#f0f6fc"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18.8">images.traj</tspan></text>
<circle cx="500" cy="398" r="5.5" fill="#199e70"/>
<text x="518" y="405.1" font-size="20" fill="#a3adb8">the band</text>
<path d="M66 414 V430 H82" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<text x="88" y="437.1" font-size="20" font-weight="500" fill="#f0f6fc"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18.8">last-error.json</tspan></text>
<circle cx="500" cy="430" r="5.5" fill="#d03b3b"/>
<text x="518" y="437.1" font-size="20" fill="#a3adb8">only after an error</text>
