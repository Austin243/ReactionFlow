<line x1="66" y1="110" x2="66" y2="126" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<text x="88" y="117.1" font-size="20" font-weight="500" fill="#f0f6fc"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18.8">state.json</tspan></text>
<circle cx="500" cy="110" r="5.5" fill="#768390"/>
<text x="518" y="117.1" font-size="20" fill="#a3adb8">phase and counters</text>
<path d="M66 126 V142 H82" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<line x1="66" y1="142" x2="66" y2="158" fill="none" stroke="#3d444d" stroke-width="1.25"/>
