<circle cx="500" cy="302" r="5.5" fill="#d95926"/>
<text x="518" y="309.1" font-size="20" fill="#a3adb8">the two bracketing frames</text>
<path d="M66 318 V334 H82" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<line x1="66" y1="334" x2="66" y2="414" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<text x="88" y="341.1" font-size="20" font-weight="700" fill="#f0f6fc"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18.8">pathways/&lt;occurrence-id&gt;/</tspan></text>
<circle cx="500" cy="334" r="5.5" fill="#199e70"/>
<text x="518" y="341.1" font-size="20" fill="#a3adb8">one per refinement attempt</text>
<path d="M96 350 V366 H112" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<line x1="96" y1="366" x2="96" y2="382" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<text x="118" y="373.1" font-size="20" font-weight="500" fill="#f0f6fc"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18.8">result.json</tspan></text>
