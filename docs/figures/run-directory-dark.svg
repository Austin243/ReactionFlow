<circle cx="500" cy="142" r="5.5" fill="#d95926"/>
<text x="518" y="149.1" font-size="20" fill="#a3adb8">occurrences and classes</text>
<path d="M66 158 V174 H82" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<line x1="66" y1="174" x2="66" y2="190" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<text x="88" y="181.1" font-size="20" font-weight="700" fill="#f0f6fc"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18.8">runtime-checkpoints/</tspan></text>
<circle cx="500" cy="174" r="5.5" fill="#3987e5"/>
<text x="518" y="181.1" font-size="20" fill="#a3adb8">the exact checkpoint</text>
<path d="M66 190 V206 H82" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<line x1="66" y1="206" x2="66" y2="222" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<text x="88" y="213.1" font-size="20" font-weight="500" fill="#f0f6fc"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18.8">segments/0000/trajectory.traj</tspan></text>
<circle cx="500" cy="206" r="5.5" fill="#3987e5"/>
