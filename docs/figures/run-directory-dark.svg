<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 518" width="1200" height="518" role="img" aria-labelledby="rf-run-directory-title rf-run-directory-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="rf-run-directory-title">What a run writes</title><desc id="rf-run-directory-desc">Directory tree of one trajectory: a contract file, state.json, the reactions.sqlite3 registry, one runtime checkpoint, numbered trajectory segments, one candidates folder per detected occurrence with reactant and product structures, and one pathways folder per refined occurrence with result.json and the band images.</desc>

<rect x="0.5" y="0.5" width="1199" height="517" rx="14" fill="#0d1117" stroke="#3d444d"/>
<rect x="36" y="16" width="1128" height="438" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="58" y="53.1" font-size="20" font-weight="700" fill="#f0f6fc"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18.8">outputs/&lt;campaign&gt;/&lt;trajectory-id&gt;/</tspan></text>
<path d="M66 62 V78 H82" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<line x1="66" y1="78" x2="66" y2="94" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<text x="88" y="85.1" font-size="20" font-weight="500" fill="#f0f6fc"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18.8">trajectory-contract.json</tspan></text>
<circle cx="500" cy="78" r="5.5" fill="#768390"/>
<text x="518" y="85.1" font-size="20" fill="#a3adb8">hashes of the inputs</text>
