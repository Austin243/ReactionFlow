<path d="M66 222 V238 H82" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<line x1="66" y1="238" x2="66" y2="318" fill="none" stroke="#3d444d" stroke-width="1.25"/>
<text x="88" y="245.1" font-size="20" font-weight="700" fill="#f0f6fc"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18.8">candidates/&lt;occurrence-id&gt;/</tspan></text>
<circle cx="500" cy="238" r="5.5" fill="#d95926"/>
<text x="518" y="245.1" font-size="20" fill="#a3adb8">one per detected occurrence</text>
