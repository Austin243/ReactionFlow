<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 404" width="1200" height="404" role="img" aria-labelledby="rf-identity-title rf-identity-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="rf-identity-title">Reaction classes</title><desc id="rf-identity-desc">A reaction occurrence is described by a change graph: atoms are nodes labeled by element, and bonds are edges labeled unchanged, formed, or broken. Occurrences with different atom numbers, a different geometry, or the reverse direction have the same graph and fall into one class; a different pattern of changes is a new class. Every occurrence is stored and refined; its class groups the results.</desc>

