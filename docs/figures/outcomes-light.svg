<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 462" width="1200" height="462" role="img" aria-labelledby="rf-outcomes-title rf-outcomes-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="rf-outcomes-title">Refinement outcomes</title><desc id="rf-outcomes-desc">Refinement runs through five stages: prepare endpoints, relax endpoints, check bonds, nudged elastic band, and climbing image. Each stage can end the attempt with a named status: unresolved, relaxation_failed, collapsed, neb_failed, or ci_neb_failed. A converged pathway is recorded as ci_neb_converged with frequency and connectivity diagnostics. Every outcome is saved, the exact checkpoint is restored, and the dynamics continue.</desc>

