name: EON integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-eon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,eon]'
      - run: pytest -q tests/test_eon_integration.py tests/test_eon_example.py
        env:
          REACTIONFLOW_TEST_EON: "1"
