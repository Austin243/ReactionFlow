name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: reactionflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        run: pytest

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Verify wheel in a clean environment
        run: |
          python -m venv /tmp/reactionflow-wheel
          /tmp/reactionflow-wheel/bin/python -m pip install dist/*.whl
          /tmp/reactionflow-wheel/bin/python -c "import reactionflow; print(reactionflow.__version__)"
      - name: Verify source distribution in a clean environment
        run: |
          python -m venv /tmp/reactionflow-sdist
          /tmp/reactionflow-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/reactionflow-sdist/bin/python -c "import reactionflow; print(reactionflow.__version__)"
