[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reactionflow"
version = "0.0.0"
description = "Automated reaction discovery and pathway refinement for atomistic trajectories"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
authors = [{ name = "Austin Ellis" }]
maintainers = [{ name = "Austin Ellis" }]
dependencies = [
  "ase>=3.28",
  "networkx>=3.4",
  "numpy>=1.26",
]

[project.scripts]
reactionflow = "reactionflow.cli:main"

[project.optional-dependencies]
ani1xnr = [
  "torch==2.11.0",
  "torchani==2.8.4",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.9",
]

[project.urls]
Repository = "https://github.com/Austin243/ReactionFlow"

[tool.hatch.build.targets.wheel]
packages = ["src/reactionflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
